      #   run: |
      #     LINK="https://SEU-USUARIO.github.io/escala-internos/"
      #     curl -s -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
      #          -F photo=@hoje.png \
      #          -F caption="Programação de hoje — escala completa: $LINK" \
      #          "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendPhoto"
